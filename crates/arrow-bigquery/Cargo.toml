[package]
name = "arrow-bigquery"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow-array = { version = "60.1.0", features = ["ffi"] }
arrow-buffer = "60.1.0"
arrow-ipc = { version = "60.1.0", features = ["lz4", "zstd"] }
arrow-schema = "60.1.0"
bytes = "1.0"
chrono = "0.4"
console-subscriber = { version = "0.5", optional = true }
google-cloud-auth = "1.17.0"
google-cloud-bigquery = "0.18.0"
google-cloud-bigquery-v2 = "1.0.0"
google-cloud-gax = "1.15.0"
google-cloud-wkt = "1.9.0"
rayon = "1.12"
rustls = { version = "0.23.37", features = ["aws_lc_rs"] }
serde_json = "1.0"
tokio = { version = "1.51.0", features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = "1.29.0"
winnow = "1.0.4"

[features]
default = []
testing = []
tracing = ["dep:console-subscriber", "dep:tracing", "dep:tracing-subscriber", "tokio/tracing"]

[lib]
bench = false

[dev-dependencies]
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
criterion = { version = "0.5.1", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "read"
harness = false

[[bench]]
name = "query"
harness = false
