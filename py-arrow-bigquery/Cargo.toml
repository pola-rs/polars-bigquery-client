[package]
name = "py-arrow-bigquery"
version = "0.1.0"
edition = "2021"

[lib]
name = "arrow_bigquery"
crate-type= ["cdylib"]

[dependencies]
chrono = "0.4"
google-cloud-auth = { git = "https://github.com/tswast/google-cloud-rust.git", branch = "tswast-bq-storage-reader" }
google-cloud-bigquery = { git = "https://github.com/tswast/google-cloud-rust.git", branch = "tswast-bq-storage-reader" }
http = "1.0"
arrow-bigquery-lib = { package = "arrow-bigquery", path = "../crates/arrow-bigquery" }
pyo3 = { version = "0.27", features = ["abi3-py310", "chrono"] }
pyo3-async-runtimes = { version = "0.27", features = ["attributes", "tokio-runtime"] }
pyo3-polars = { version = "0.26.0", features = ["derive", "lazy"] }
polars-arrow = { version = "0.53.0", default-features = false }
tokio = { version = "1.51.0", features = ["rt", "sync", "time"] }

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dev-dependencies]
google-cloud-gax = { git = "https://github.com/tswast/google-cloud-rust.git", branch = "tswast-bq-storage-reader" }
