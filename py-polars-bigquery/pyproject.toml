[project]
name = "polars-bigquery"
version = "0.1.0"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "arrow-bigquery",
    "google-auth >= 2.40.3",
    "polars >= 1.43.0, < 2.0.0",
    "requests >= 2.33.0, < 3.0.0",
    "cachetools >= 5.0.0",
]

[tool.uv.sources]
arrow-bigquery = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pyparsing>=2.4.7",
    "pytest>=8.4.1",
    "pytest-benchmark>=5.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.10",
]
test = [
    "pytest>=8.4.1",
    "pytest-benchmark>=5.1.0",
    "pytest-xdist>=3.8.0",
]
