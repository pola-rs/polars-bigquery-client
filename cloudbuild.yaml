substitutions:
  _GOOGLE_CLOUD_PROJECT: polars-bigquery-community
  _CI_REPOSITORY_NAME: test-polars-bigquery-community
  _CI_IMAGE_NAME: polars-bigquery-client-base
  _REGION: us-central1
  _BENCHER_PROJECT: polars-bigquery-client
  _BENCHER_TESTBED: cloudbuild-e2-highcpu-8
  _BENCHER_API_KEY_SECRET: bencher-api-key
  _BASE_BRANCH: main
  _RUST_BENCH_FILTER: ""

steps:
  - id: build-ci-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CI_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest"
        docker pull "$${CI_IMAGE}" || true
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$${CI_IMAGE}" \
          -t "$${CI_IMAGE}" \
          -f .cloudbuild/Dockerfile \
          .
        docker push "$${CI_IMAGE}" || echo "Warning: could not push cache image to $${CI_IMAGE}"

  - id: install-dependencies-and-build
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
    env:
      - RUSTFLAGS=-C debuginfo=0
      - RUST_BACKTRACE=1
      - PYTHONUTF8=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mask rust-arrow-bigquery build
        mask py-polars-bigquery build

  - id: run-integration-tests
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
    env:
      - GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT}
      - RUSTFLAGS=-C debuginfo=0
      - RUST_BACKTRACE=1
      - PYTHONUTF8=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mask test integration

  - id: run-rust-benchmarks
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
    secretEnv:
      - BENCHER_API_KEY
    env:
      - GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT}
      - RUSTFLAGS=-C debuginfo=0
      - RUST_BACKTRACE=1
      - PYTHONUTF8=1
      - COMMIT_SHA=${COMMIT_SHA}
      - BRANCH_NAME=${BRANCH_NAME}
      - _PR_NUMBER=${_PR_NUMBER}
      - _HEAD_BRANCH=${_HEAD_BRANCH}
      - _BASE_BRANCH=${_BASE_BRANCH}
      - _BENCHER_PROJECT=${_BENCHER_PROJECT}
      - _BENCHER_TESTBED=${_BENCHER_TESTBED}
      - _RUST_BENCH_FILTER=${_RUST_BENCH_FILTER}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Pre-compile benchmark binary before invoking bencher
        cargo bench --package arrow-bigquery --bench read --no-run

        bencher_args=(
          --project "${_BENCHER_PROJECT}"
          --testbed "${_BENCHER_TESTBED}"
          --adapter rust_criterion
          --error-on-alert
        )

        if [ -n "$${COMMIT_SHA:-}" ]; then
          bencher_args+=(--hash "$${COMMIT_SHA}")
        fi

        if [ -z "$${_PR_NUMBER:-}" ] && [ "$${BRANCH_NAME:-main}" = "${_BASE_BRANCH}" ]; then
          bencher_args+=(
            --branch "${_BASE_BRANCH}"
            --threshold-measure latency
            --threshold-test t_test
            --threshold-max-sample-size 64
            --threshold-upper-boundary 0.99
            --thresholds-reset
          )
        else
          target_branch="$${_HEAD_BRANCH:-$${BRANCH_NAME:-pr-$${_PR_NUMBER}}}"
          bencher_args+=(
            --branch "$${target_branch}"
            --start-point "${_BASE_BRANCH}"
            --start-point-clone-thresholds
            --start-point-reset
          )
          git fetch origin "${_BASE_BRANCH}" --depth=50 || true
          start_point_hash="$$(git merge-base HEAD "origin/${_BASE_BRANCH}" 2>/dev/null || git rev-parse "origin/${_BASE_BRANCH}" 2>/dev/null || true)"
          if [ -n "$${start_point_hash}" ]; then
            bencher_args+=(--start-point-hash "$${start_point_hash}")
          fi
        fi

        mask_cmd="mask rust-arrow-bigquery test benchmark"
        if [ -n "${_RUST_BENCH_FILTER}" ]; then
          mask_cmd="$${mask_cmd} --filter '${_RUST_BENCH_FILTER}'"
        fi

        bencher run "$${bencher_args[@]}" "$${mask_cmd}"

  - id: run-python-benchmarks
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
    secretEnv:
      - BENCHER_API_KEY
    env:
      - GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT}
      - RUSTFLAGS=-C debuginfo=0
      - RUST_BACKTRACE=1
      - PYTHONUTF8=1
      - COMMIT_SHA=${COMMIT_SHA}
      - BRANCH_NAME=${BRANCH_NAME}
      - _PR_NUMBER=${_PR_NUMBER}
      - _HEAD_BRANCH=${_HEAD_BRANCH}
      - _BASE_BRANCH=${_BASE_BRANCH}
      - _BENCHER_PROJECT=${_BENCHER_PROJECT}
      - _BENCHER_TESTBED=${_BENCHER_TESTBED}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        results_file="/tmp/pytest_benchmark_results.json"

        bencher_args=(
          --project "${_BENCHER_PROJECT}"
          --testbed "${_BENCHER_TESTBED}"
          --adapter python_pytest
          --file "$${results_file}"
          --error-on-alert
        )

        if [ -n "$${COMMIT_SHA:-}" ]; then
          bencher_args+=(--hash "$${COMMIT_SHA}")
        fi

        if [ -z "$${_PR_NUMBER:-}" ] && [ "$${BRANCH_NAME:-main}" = "${_BASE_BRANCH}" ]; then
          bencher_args+=(
            --branch "${_BASE_BRANCH}"
            --threshold-measure latency
            --threshold-test t_test
            --threshold-max-sample-size 64
            --threshold-upper-boundary 0.99
            --thresholds-reset
          )
        else
          target_branch="$${_HEAD_BRANCH:-$${BRANCH_NAME:-pr-$${_PR_NUMBER}}}"
          bencher_args+=(
            --branch "$${target_branch}"
            --start-point "${_BASE_BRANCH}"
            --start-point-clone-thresholds
            --start-point-reset
          )
          git fetch origin "${_BASE_BRANCH}" --depth=50 || true
          start_point_hash="$$(git merge-base HEAD "origin/${_BASE_BRANCH}" 2>/dev/null || git rev-parse "origin/${_BASE_BRANCH}" 2>/dev/null || true)"
          if [ -n "$${start_point_hash}" ]; then
            bencher_args+=(--start-point-hash "$${start_point_hash}")
          fi
        fi

        bencher run "$${bencher_args[@]}" \
          "mask py-polars-bigquery test benchmark --output $${results_file}"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_BENCHER_API_KEY_SECRET}/versions/latest
      env: BENCHER_API_KEY

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
