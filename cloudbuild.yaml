substitutions:
  _GOOGLE_CLOUD_PROJECT: polars-bigquery-community
  _CI_REPOSITORY_NAME: test-polars-bigquery-community
  _CI_IMAGE_NAME: polars-bigquery-client-base
  _REGION: us-central1
  _BASE_BRANCH: main

steps:
  - id: build-ci-image
    name: gcr.io/cloud-builders/docker
    env:
      - CI_IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
      - BRANCH_NAME=${BRANCH_NAME}
      - _PR_NUMBER=${_PR_NUMBER}
      - _BASE_BRANCH=${_BASE_BRANCH}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker pull "$${CI_IMAGE}" || true
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$${CI_IMAGE}" \
          -t "$${CI_IMAGE}" \
          -f .cloudbuild/Dockerfile \
          .
        if [ -z "$${_PR_NUMBER:-}" ] && [ -n "$${_BASE_BRANCH:-}" ] && [ "$${BRANCH_NAME:-}" = "$${_BASE_BRANCH}" ]; then
          docker push "$${CI_IMAGE}" || echo "Warning: could not push cache image to $${CI_IMAGE}"
        else
          echo "Skipping push of $${CI_IMAGE} (PR or non-base branch build)"
        fi

  - id: install-dependencies-and-build
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
    env:
      - RUSTFLAGS=-C debuginfo=0
      - RUST_BACKTRACE=1
      - PYTHONUTF8=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mask rust-arrow-bigquery build
        mask py-polars-bigquery build

  - id: run-integration-tests
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_CI_REPOSITORY_NAME}/${_CI_IMAGE_NAME}:latest
    env:
      - GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT}
      - RUSTFLAGS=-C debuginfo=0
      - RUST_BACKTRACE=1
      - PYTHONUTF8=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mask test integration

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  dynamicSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
